# Ambiente de desenvolvimento do AdotaPet.
# Sobe tudo com:  docker compose up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # os dados sobrevivem a um "down"
    ports:
      - "5432:5432" # para abrir o banco no DBeaver/pgAdmin, se quiser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app # editar o código na sua máquina reflete no container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # só sobe depois que o banco aceitar conexões

  frontend:
    build: ./frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules # mantém o node_modules do container, não o da sua máquina
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
